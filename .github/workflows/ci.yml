
name: Student Management System CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Python Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Validate Python syntax
      - name: Validate Python Files
        run: |
          python -m compileall -q .

      # Step 5: Run automated tests if test files exist
      - name: Run Pytest
        shell: bash
        run: |
          if find . \
            -path './.git' -prune -o \
            -path './venv' -prune -o \
            -type f \( -name 'test_*.py' -o -name '*_test.py' \) \
            -print | grep -q .; then

            python -m pytest -v

          else
            echo "::warning::No pytest test files found. Tests were skipped."
          fi
